app = "awa-shoppable-videos"
primary_region = "iad"

[build]

# Migrations run once per deploy in a throwaway machine. The server itself
# starts straight away (Render keeps using the Dockerfile's docker-start).
[deploy]
  release_command = "npx prisma migrate deploy"

[processes]
  app = "npm run start"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
