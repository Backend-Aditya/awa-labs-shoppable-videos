<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AwaSv storefront harness</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .page-width { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .product { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-height: 240px; }
      /* Stacks on phones like a real theme (two columns made the page wider than the screen). */
      @media (max-width: 749px) { .product { grid-template-columns: minmax(0, 1fr); } }
      .product__media { background: #eee; aspect-ratio: 1; }
    </style>
    <script>
      window.Shopify = { shop: "harness.myshopify.com", currency: { active: "USD" } };
    </script>
    <!--AWA_SV_HEAD-->
  </head>
  <body>
    <!-- Mirrors a theme product template: the app embed (loader, config,
         floating video) plus app blocks and their schema assets. The
         AWA_SV_* markers are replaced by tests/e2e/server.mjs with the real
         Liquid rendered by liquidjs. -->
    <main class="page-width">
      <section class="product">
        <div class="product__media"></div>
        <div>
          <h1>Linen Shirt</h1>
          <p>$48.00</p>
          <!--AWA_SV_ATC-->
        </div>
      </section>
      <!--AWA_SV_STRIP-->
      <!--AWA_SV_STORIES-->
    </main>
    <!--AWA_SV_EMBED-->
  </body>
</html>
