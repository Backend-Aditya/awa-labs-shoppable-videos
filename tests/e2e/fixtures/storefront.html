<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reelup storefront harness</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .page-width { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .product { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-height: 240px; }
      .product__media { background: #eee; aspect-ratio: 1; }
    </style>
    <script>
      window.Shopify = { shop: "harness.myshopify.com", currency: { active: "USD" } };
    </script>
  </head>
  <body>
    <!-- Mirrors a theme product template: the app embed (scripts, config,
         floating video) plus app blocks. The REELUP_* markers are replaced
         by tests/e2e/server.mjs with the real Liquid rendered by liquidjs. -->
    <main class="page-width">
      <section class="product">
        <div class="product__media"></div>
        <div>
          <h1>Linen Shirt</h1>
          <p>$48.00</p>
          <!--REELUP_ATC-->
        </div>
      </section>
      <!--REELUP_STRIP-->
      <!--REELUP_STORIES-->
    </main>
    <!--REELUP_EMBED-->
  </body>
</html>
