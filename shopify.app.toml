# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9ea31b9c552028b42fe272081db2b3e3"
application_url = "https://awa-shoppable-videos.onrender.com"
embedded = true
name = "AWAlabs Shoppable Videos"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobject_definitions,write_metaobjects,write_products"

[metaobjects.app.reel]
name = "Reel"
description = "A single shoppable video: source, tagged products, poster, and interaction config"

  [metaobjects.app.reel.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[metaobjects.app.reel.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.reel.fields.published]
name = "Published"
type = "boolean"
required = true

[metaobjects.app.reel.fields.config]
name = "Config"
type = "json"
required = true
description = "cloudflareStreamUid, posterUrl, durationSeconds, productIds, interactions {ctaLabel, ctaUrl}, source {type, originalUrl}, seoTitle, seoDescription"

[metaobjects.app.reel.fields.tagged_products]
name = "Tagged products"
type = "list.product_reference"
description = "Mirrors config.productIds as native product references so Liquid can resolve full product data (title, price, image) without a runtime API call"

[product.metafields.app.reels]
type = "list.metaobject_reference<$app:reel>"
name = "Reels"
description = "Reels tagged to this product, referenced by metaobject ID"

  [product.metafields.app.reels.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[shop.metafields.app.enabled]
type = "boolean"
name = "Shoppable videos enabled"
description = "Master on/off switch for every storefront widget, set from the app's Settings page"

  [shop.metafields.app.enabled.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.product_page_reels_widget]
type = "json"
name = "Product page reels widget"
description = "Published state and target rule for the PRODUCT_PAGE_REELS widget"

  [shop.metafields.app.product_page_reels_widget.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.product_page_reels_widget_reels]
type = "list.metaobject_reference<$app:reel>"
name = "Product page reels widget - curated reels"
description = "The reels the PRODUCT_PAGE_REELS widget shows, picked directly in the widget"

  [shop.metafields.app.product_page_reels_widget_reels.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.single_video_widget]
type = "json"
name = "Single video widget"
description = "Published state and target rule for the SINGLE_VIDEO widget"

  [shop.metafields.app.single_video_widget.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.single_video_featured_reel]
type = "metaobject_reference<$app:reel>"
name = "Single video featured reel"
description = "The one reel the SINGLE_VIDEO widget plays"

  [shop.metafields.app.single_video_featured_reel.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.add_to_cart_video_widget]
type = "json"
name = "Add-to-cart video widget"
description = "Published state and target rule for the ADD_TO_CART_VIDEO widget"

  [shop.metafields.app.add_to_cart_video_widget.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.add_to_cart_video_featured_reel]
type = "metaobject_reference<$app:reel>"
name = "Add-to-cart video featured reel"
description = "The one reel the ADD_TO_CART_VIDEO widget plays"

  [shop.metafields.app.add_to_cart_video_featured_reel.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.stacked_carousel_widget]
type = "json"
name = "Stacked carousel widget"
description = "Published state and target rule for the CAROUSEL widget"

  [shop.metafields.app.stacked_carousel_widget.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.stacked_carousel_widget_reels]
type = "list.metaobject_reference<$app:reel>"
name = "Stacked carousel widget - curated reels"
description = "The reels the CAROUSEL widget shows, picked directly in the widget"

  [shop.metafields.app.stacked_carousel_widget_reels.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.insta_stories_widget]
type = "json"
name = "Insta-style stories widget"
description = "Published state and target rule for the STORIES widget"

  [shop.metafields.app.insta_stories_widget.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.insta_stories_widget_reels]
type = "list.metaobject_reference<$app:reel>"
name = "Insta-style stories widget - curated reels"
description = "The reels the STORIES widget shows, picked directly in the widget (no Liquid block reads this yet)"

  [shop.metafields.app.insta_stories_widget_reels.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.reel_pops_widget]
type = "json"
name = "Reel pops widget"
description = "Published state and target rule for the REEL_POPS widget"

  [shop.metafields.app.reel_pops_widget.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.reel_pops_featured_reel]
type = "metaobject_reference<$app:reel>"
name = "Reel pops featured reel"
description = "The one reel the REEL_POPS floating bubble plays"

  [shop.metafields.app.reel_pops_featured_reel.access]
  admin = "merchant_read"
  storefront = "public_read"

[auth]
redirect_urls = [ "https://awa-shoppable-videos.onrender.com/api/auth" ]

[app_proxy]
url = "https://awa-shoppable-videos.onrender.com/api"
subpath = "reels"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://awa-shoppable-videos.onrender.com/webhooks/customers/data_request"
  customer_deletion_url = "https://awa-shoppable-videos.onrender.com/webhooks/customers/redact"
  shop_deletion_url = "https://awa-shoppable-videos.onrender.com/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
