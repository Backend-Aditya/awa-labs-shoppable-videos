[auth]
redirect_urls = [ "https://awa-shoppable-videos.fly.dev/api/auth" ]

[app_proxy]
url = "https://awa-shoppable-videos.fly.dev/api"
subpath = "reels"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # orders/paid is a "protected customer data" webhook topic, Shopify
  # rejects the whole app version if it's declared without prior approval
  # (Partner Dashboard > App setup > Protected customer data access).
  # The handler (webhooks.orders.paid.tsx) and its model code are already
  # shipped; re-add this subscription once that approval comes through,
  # then redeploy, no other changes needed. Until then, add-to-cart
  # tagging is live but nothing captures it yet, so there's nothing to
  # backfill once this re-enables, only orders placed after it does.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/paid"
  # topics = [ "orders/paid" ]

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://awa-shoppable-videos.fly.dev/webhooks/customers/data_request"
  customer_deletion_url = "https://awa-shoppable-videos.fly.dev/webhooks/customers/redact"
  shop_deletion_url = "https://awa-shoppable-videos.fly.dev/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
